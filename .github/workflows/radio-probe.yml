name: Dalga Kanal + RSS Kaynak Testi

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Ek test edilecek RSS adresleri (boşlukla ayrılmış)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests==2.32.3
      - run: python tools/radio_probe.py
      - name: RSS kaynak testi
        env:
          URLS: ${{ inputs.urls }}
        run: python tools/feed_probe.py $URLS
