name: Worker Deploy

# workers/ altında değişiklik main'e girince 4 worker'ı Cloudflare'e yükler.
on:
  push:
    branches: [main]
    paths: ['workers/**']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      matrix:
        worker: [radar-market, radar-scores, radar-hls-proxy, radar-notify]  # notify en son: binding'leri diğerlerine bağlı
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Deploy ${{ matrix.worker }}
        working-directory: workers/wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.20.0 deploy --config ${{ matrix.worker }}.toml
