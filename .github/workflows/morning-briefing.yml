name: RADAR Sabah Brifingi

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 08:00 TR (GitHub cron birkaç dk gecikebilir)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece log'a yaz, gönderme"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests==2.32.3
      - name: Brifingi oluştur ve gönder
        run: python morning_briefing.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          BUTTONDOWN_TOKEN: ${{ secrets.BUTTONDOWN_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://p9ggcdpkmw-maker.github.io/radar/' }}
          FAV_TEAMS: ${{ vars.FAV_TEAMS || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
