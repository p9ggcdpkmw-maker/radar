name: RADAR Haber Botu

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: haber-guncelle
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: PWA ikonlarını üret
        run: python icons.py

      - name: Botu çalıştır
        run: python fetch_and_summarize.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_API_TOKEN:   ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          BUTTONDOWN_TOKEN: ${{ secrets.BUTTONDOWN_TOKEN }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          AI_TEMPERATURE: ${{ vars.AI_TEMPERATURE || '0.2' }}
          AI_PROMPT_VER: ${{ vars.AI_PROMPT_VER || 'v1.3' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://p9ggcdpkmw-maker.github.io/radar/' }}
          AI_PACE_SECONDS: ${{ vars.AI_PACE_SECONDS || '10' }}
          AI_TEXT_LIMIT: ${{ vars.AI_TEXT_LIMIT || '700' }}
          EVENT_CLUSTER: ${{ vars.EVENT_CLUSTER || '0' }}

      - name: Arşiv snapshot oluştur (son 60 gün)
        run: |
          DATE=$(date -u +%F)
          mkdir -p archive
          cp news.json "archive/${DATE}.json"
          python - <<'PY'
          import json, glob, os
          KEEP = 180
          files = [f for f in glob.glob("archive/*.json")
                   if os.path.basename(f) != "index.json"]
          files.sort(key=lambda f: os.path.basename(f)[:-5], reverse=True)
          for f in files[KEEP:]:
              os.remove(f)
              print("Eski arşiv silindi:", f)
          kept = files[:KEEP]
          manifest = [{"date": os.path.basename(f)[:-5], "path": f} for f in kept]
          with open("archive/index.json", "w", encoding="utf-8") as fh:
              json.dump({"dates": manifest}, fh, ensure_ascii=False, indent=2)
          print(f"{len(manifest)} arşiv dosyası tutuluyor (limit {KEEP}).")
          PY

      - name: Haberleri, arşivi, RSS ve ikonları commit et
        run: |
          git config user.name "radar-botu"
          git config user.email "radar-botu@users.noreply.github.com"
          git add -A news.json archive/ feed.xml feed-*.xml icon-*.png apple-touch-icon.png favicon-32.png
          if git diff --quiet --cached; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "RADAR: Haberler + arşiv + RSS güncellendi ($(date -u +%F))"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done

      - name: Hata bildirimi
        if: failure()
        run: |
          curl -s -d "RADAR Botu başarısız: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -H "Title: RADAR HATA" -H "Tags: warning" \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" || true
