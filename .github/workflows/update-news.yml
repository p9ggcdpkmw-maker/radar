name: RADAR Haber Botu

on:
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: haber-guncelle
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Botu çalıştır
        run: python fetch_and_summarize.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AI_TEMPERATURE: ${{ vars.AI_TEMPERATURE || '0.2' }}
          AI_PROMPT_VER: ${{ vars.AI_PROMPT_VER || 'v1.1' }}

      - name: Arşiv snapshot oluştur
        run: |
          DATE=$(date -u +%F)
          mkdir -p archive
          cp news.json "archive/${DATE}.json"
          python - <<'PY'
          import json, glob, os
          files = sorted(glob.glob("archive/*.json"), reverse=True)
          manifest = [
              {"date": os.path.basename(f)[:-5], "path": f}
              for f in files if os.path.basename(f) != "index.json"
          ]
          with open("archive/index.json", "w", encoding="utf-8") as fh:
              json.dump({"dates": manifest}, fh, ensure_ascii=False, indent=2)
          print(f"{len(manifest)} arşiv dosyası manifeste yazıldı.")
          PY

      - name: news.json ve arşiv değiştiyse commit et
        run: |
          git config user.name "radar-botu"
          git config user.email "radar-botu@users.noreply.github.com"
          git add news.json archive/
          if git diff --quiet --cached; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "RADAR: Haberler + arşiv güncellendi ($(date -u +%F))"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done

      - name: Hata bildirimi
        if: failure()
        run: |
          curl -s -d "RADAR Botu başarısız: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -H "Title: RADAR HATA" -H "Tags: warning" \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" || true