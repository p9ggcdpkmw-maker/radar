<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233B82F6'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white'%3E📡%3C/text%3E%3C/svg%3E">

<body>

<!-- ... (HTML yapısı aynı kalacak) ... -->

<script>
// ... (Değişken tanımlamaları aynı kalacak) ...

// 🚀 DÜZELTME 2: SESLİ OKUMA (TTS) BUG'I GİDERİLDİ
function speakText() {
  if (!window.speechSynthesis) {
    alert("Tarayıcınız sesli okumayı desteklemiyor.");
    return;
  }
  
  const btn = document.getElementById('btnListen');

  // Eğer hali hazırda konuşuyorsa durdur
  if (window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
    btn.innerHTML = "🔊 Sesli Dinle";
    return;
  }

  if (!currentModalItem) return;

  let textToRead = currentModalItem.title + ". " + (currentModalItem.summary || "Özet bulunamadı.");
  const utterance = new SpeechSynthesisUtterance(textToRead);
  utterance.lang = 'tr-TR';
  utterance.rate = 1.0; 
  
  btn.innerHTML = "⏹ Durdur";
  
  utterance.onend = () => { btn.innerHTML = "🔊 Sesli Dinle"; };
  utterance.onerror = () => { btn.innerHTML = "🔊 Sesli Dinle"; };

  window.speechSynthesis.speak(utterance);
}

// ... (Diğer fonksiyonlar aynı kalacak) ...

// 🚀 DÜZELTME 1: POLLING (Veri Yenileme) HATASI GİDERİLDİ
async function loadData() {
  try {
    const res = await fetch('news.json?t=' + Date.now());
    if (!res.ok) throw new Error('Veri alınamadı');
    const data = await res.json();
    allNews = data.items || [];
    marketData = data.market; stocksData = data.stocks; cryptoData = data.crypto; weatherData = data.weather;
    briefingsData = data.briefings || {};
    
    renderNews(); 
    renderAIBriefing(); 
    renderWidgets(); 
    
    // 🚀 Eğer kullanıcı Piyasalar sekmesindeyse, ekranı da güncelle
    if (activeView === 'market') {
      renderMarketView();
    }
  } catch (e) {
    document.getElementById('newsGrid').innerHTML = `<div style="text-align:center; padding:20px; font-weight:600; color:#EF4444;">Bağlantı hatası: ${e.message}</div>`;
  }
}

// 🚀 DÜZELTME 3: VERİ GÜVENLİĞİ (Optional Chaining)
function renderWidgets() {
  const mContainer = document.getElementById('marketWidgetContent');
  if (mContainer && marketData) {
    let mHtml = '';
    if(marketData.usdtry) mHtml += `<div class="market-item"><div class="market-name">USD/TRY</div><div><div class="market-val">${marketData.usdtry.toFixed(2)}</div><div class="market-pct pct-up">+0.4%</div></div></div>`;
    if(marketData.ceyrek_altin_try) mHtml += `<div class="market-item"><div class="market-name">Çeyrek Altın</div><div><div class="market-val">${marketData.ceyrek_altin_try.toLocaleString('tr-TR')}</div><div class="market-pct pct-up">+1.1%</div></div></div>`;
    if(cryptoData) cryptoData.forEach(c => mHtml += `<div class="market-item"><div class="market-name">${esc(c.label)}</div><div><div class="market-val">${(c.price || 0).toLocaleString('tr-TR')}</div><div class="market-pct ${c.change_pct >= 0 ? 'pct-up' : 'pct-down'}">${c.change_pct >= 0 ? '+' : ''}${(c.change_pct || 0).toFixed(2)}%</div></div></div>`);
    mContainer.innerHTML = mHtml || '<div style="color:var(--text-muted); font-size:12px;">Piyasa verisi yok.</div>';
  }
  
  const wContainer = document.getElementById('weatherWidgetContent');
  if (weatherData && wContainer) {
    wContainer.innerHTML = `<div class="weather-temp">${Math.round(weatherData.temp || 0)}°C</div><div class="weather-desc">${esc(weatherData.desc)} · Çorlu</div><div class="weather-forecast"><div class="wf-day">Pzt<div class="wf-icon">☀️</div>24°</div><div class="wf-day">Sal<div class="wf-icon">☁️</div>22°</div><div class="wf-day">Çar<div class="wf-icon">🌧️</div>19°</div><div class="wf-day">Per<div class="wf-icon">☀️</div>25°</div><div class="wf-day">Cum<div class="wf-icon">☀️</div>26°</div></div>`;
  }
}

function renderMarketView() {
  const container = document.getElementById('fullMarketContent');
  const wContainer = document.getElementById('fullWeatherContent');
  if(!container) return;
  
  if (!marketData && !cryptoData && !stocksData) {
     container.innerHTML = '<div style="color:var(--text-muted); font-size:14px; padding:10px;">Piyasa verisi yüklenemedi.</div>';
     return;
  }
  
  let mHtml = '';
  if(marketData && marketData.usdtry) mHtml += `<div class="market-item"><div><div class="market-name">USD/TRY</div></div><div class="market-val">${marketData.usdtry.toFixed(2)}</div></div>`;
  if(cryptoData) cryptoData.forEach(c => mHtml += `<div class="market-item"><div><div class="market-name">${esc(c.label)}</div></div><div><div class="market-val">${(c.price || 0).toLocaleString('tr-TR')}</div><div class="market-pct ${c.change_pct >= 0 ? 'pct-up' : 'pct-down'}">${c.change_pct >= 0 ? '+' : ''}${(c.change_pct || 0).toFixed(2)}%</div></div></div>`);
  if(stocksData) stocksData.forEach(s => mHtml += `<div class="market-item"><div><div class="market-name">${esc(s.label)}</div></div><div><div class="market-val">${(s.price || 0).toLocaleString('tr-TR')}</div><div class="market-pct ${s.change_pct >= 0 ? 'pct-up' : 'pct-down'}">${s.change_pct >= 0 ? '+' : ''}${(s.change_pct || 0).toFixed(2)}%</div></div></div>`);
  container.innerHTML = mHtml;
  
  if (weatherData && wContainer) {
    wContainer.innerHTML = `<div class="weather-temp">${Math.round(weatherData.temp || 0)}°C</div><div class="weather-desc">${esc(weatherData.desc)} · Çorlu</div>`;
  }
}

function closeModal(modalId) { 
  document.getElementById(modalId).classList.remove('active'); 
  if(modalId === 'newsModal' && window.speechSynthesis) {
    window.speechSynthesis.cancel();
    document.getElementById('btnListen').innerHTML = "🔊 Sesli Dinle"; 
  }
}

// ... (Geri kalan kodlar aynı kalacak) ...
</script>
</body>
</html>
